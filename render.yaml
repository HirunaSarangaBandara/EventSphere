databases:
  - name: eventsphere-db
    databaseName: eventsphere
    user: eventsphere

services:
  - type: web
    name: eventsphere
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventsphere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://eventsphere.onrender.com
      - key: WAITLIST_HOLD_MINUTES
        value: "10"
      - key: WAITLIST_SWEEP_SECONDS
        value: "30"
      - key: CHECKIN_EARLY_MINUTES
        value: "180"
      - key: CHECKIN_LATE_MINUTES
        value: "120"
